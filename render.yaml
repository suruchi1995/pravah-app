services:
  - type: web
    name: pravah-api
    runtime: docker
    dockerfilePath: ./infra/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # set in Render dashboard to your Neon connection string
      - key: GROQ_API_KEY
        sync: false          # set in Render dashboard; never commit
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: DEFAULT_TENANT
        value: apex
