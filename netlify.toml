[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Proxy API calls to the Render backend. Replace REPLACE_WITH_RENDER_URL after deploy.
[[redirects]]
  from = "/api/*"
  to = "https://pravah-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
