[build]
  base = "frontend"
  command = "npm install && npm run build"
  publish = "frontend/dist"

# Proxy API calls to the Render backend. Replace REPLACE_WITH_RENDER_URL after deploy.
[[redirects]]
  from = "/api/*"
  to = "https://REPLACE_WITH_RENDER_URL/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
